name: Release Template

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create template zip
        run: |
          mkdir -p /tmp/template/gauge-playwright-ts
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.pnpm-store' \
            --exclude='reports' \
            --exclude='logs' \
            --exclude='.gauge' \
            --exclude='dist' \
            . /tmp/template/gauge-playwright-ts/
          cd /tmp/template
          zip -r $GITHUB_WORKSPACE/gauge-playwright-ts.zip gauge-playwright-ts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gauge-playwright-ts.zip
          generate_release_notes: true
