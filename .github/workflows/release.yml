name: Release Template

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create template zip
        run: |
          zip -r gauge-playwright-ts.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude ".pnpm-store/*" \
            --exclude "reports/*" \
            --exclude "logs/*" \
            --exclude ".gauge/*" \
            --exclude "dist/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gauge-playwright-ts.zip
          generate_release_notes: true
